<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karthik Mart | Premium Shopping</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .product-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Expanded Product Catalog ---
        const PRODUCTS = [
            { id: 1, name: "K-Ultra Wireless", price: 299, category: "Electronics", rating: 4.8, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500", desc: "Noise cancelling high-fidelity audio." },
            { id: 2, name: "Signature Chrono", price: 185, category: "Accessories", rating: 4.9, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500", desc: "Genuine leather, Japanese movement." },
            { id: 3, name: "Smart Vision Pro", price: 120, category: "Electronics", rating: 4.5, image: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500", desc: "Next-gen augmented reality glasses." },
            { id: 4, name: "Urban Stealth Pack", price: 85, category: "Lifestyle", rating: 4.7, image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500", desc: "Water-resistant, anti-theft design." },
            { id: 5, name: "Aero Desk Lamp", price: 45, category: "Home", rating: 4.6, image: "https://images.unsplash.com/photo-1534073828943-f801091bb270?w=500", desc: "Dimmable LED with wireless charging." },
            { id: 6, name: "K-Click Mechanical", price: 150, category: "Electronics", rating: 4.9, image: "https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=500", desc: "RGB backlit with tactile switches." },
            { id: 7, name: "Polar Hydrate Bot", price: 35, category: "Lifestyle", rating: 4.4, image: "https://images.unsplash.com/photo-1602143393494-721d002ed3ad?w=500", desc: "Insulated steel, 24hr cold." },
            { id: 8, name: "Zen Office Chair", price: 399, category: "Home", rating: 5.0, image: "https://images.unsplash.com/photo-1505797149-43b0069ec26b?w=500", desc: "Full lumbar support, premium mesh." }
        ];

        const CATEGORIES = ["All", "Electronics", "Accessories", "Lifestyle", "Home"];

        const App = () => {
            // State persistence with LocalStorage
            const [cart, setCart] = useState(() => JSON.parse(localStorage.getItem('cart')) || []);
            const [history, setHistory] = useState(() => JSON.parse(localStorage.getItem('history')) || []);
            const [search, setSearch] = useState("");
            const [category, setCategory] = useState("All");
            const [view, setView] = useState('shop'); // shop, checkout, success
            const [isCartOpen, setIsCartOpen] = useState(false);

            useEffect(() => {
                localStorage.setItem('cart', JSON.stringify(cart));
                localStorage.setItem('history', JSON.stringify(history));
                lucide.createIcons();
            }, [cart, history, view, isCartOpen]);

            const filteredProducts = PRODUCTS.filter(p => 
                (category === "All" || p.category === category) &&
                p.name.toLowerCase().includes(search.toLowerCase())
            );

            const addToCart = (product) => {
                setCart(prev => {
                    const item = prev.find(i => i.id === product.id);
                    if (item) return prev.map(i => i.id === product.id ? {...i, qty: i.qty + 1} : i);
                    return [...prev, { ...product, qty: 1 }];
                });
            };

            const updateQty = (id, delta) => {
                setCart(prev => prev.map(i => 
                    i.id === id ? { ...i, qty: Math.max(1, i.qty + delta) } : i
                ).filter(i => i.qty > 0));
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const handleCheckout = (e) => {
                e.preventDefault();
                const newOrder = { id: '#' + Math.floor(Math.random()*90000), date: new Date().toLocaleDateString(), total: cartTotal, items: cart.length };
                setHistory([newOrder, ...history]);
                setCart([]);
                setView('success');
            };

            return (
                <div className="min-h-screen">
                    {/* Navigation */}
                    <nav className="sticky top-0 z-40 glass border-b border-slate-200 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('shop')}>
                                <div className="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-200">
                                    <i data-lucide="shopping-bag" className="text-white w-5 h-5"></i>
                                </div>
                                <span className="text-xl font-extrabold tracking-tighter uppercase">Karthik<span className="text-indigo-600">Mart</span></span>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <button onClick={() => setIsCartOpen(true)} className="relative p-2 hover:bg-slate-100 rounded-full transition">
                                    <i data-lucide="shopping-cart" className="w-6 h-6"></i>
                                    {cart.length > 0 && <span className="absolute top-0 right-0 bg-orange-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">{cart.reduce((a,b)=>a+b.qty, 0)}</span>}
                                </button>
                            </div>
                        </div>
                    </nav>

                    {view === 'shop' && (
                        <>
                            {/* Hero Section */}
                            <header className="bg-indigo-900 py-16 px-6 mb-12 relative overflow-hidden">
                                <div className="max-w-7xl mx-auto relative z-10 text-center lg:text-left flex flex-col lg:flex-row items-center justify-between gap-10">
                                    <div className="max-w-xl">
                                        <h2 className="text-4xl md:text-6xl font-extrabold text-white leading-tight mb-4">Elevate Your Everyday Essentials</h2>
                                        <p className="text-indigo-100 text-lg mb-8">Premium curated products for the modern lifestyle. Quality guaranteed by Karthik Mart.</p>
                                        <div className="flex gap-4 justify-center lg:justify-start">
                                            <button className="bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-full font-bold transition">New Arrivals</button>
                                            <button className="border border-white/30 text-white px-8 py-3 rounded-full font-bold hover:bg-white/10 transition">Member Perks</button>
                                        </div>
                                    </div>
                                    <div className="hidden lg:block relative">
                                        <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=500" className="rounded-2xl shadow-2xl rotate-3 w-80" />
                                        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" className="absolute -bottom-10 -left-20 rounded-2xl shadow-2xl -rotate-6 w-64" />
                                    </div>
                                </div>
                                <div className="absolute top-0 right-0 w-1/2 h-full bg-gradient-to-l from-indigo-800 to-transparent"></div>
                            </header>

                            {/* Products Area */}
                            <main className="max-w-7xl mx-auto px-6 pb-20">
                                <div className="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
                                    <div className="flex gap-2 overflow-x-auto w-full md:w-auto no-scrollbar">
                                        {CATEGORIES.map(cat => (
                                            <button key={cat} onClick={() => setCategory(cat)} className={`px-5 py-2 rounded-full text-sm font-semibold transition ${category === cat ? 'bg-slate-900 text-white' : 'bg-white border text-slate-600 hover:border-indigo-400'}`}>
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="relative w-full md:w-80">
                                        <i data-lucide="search" className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                                        <input type="text" placeholder="Search Karthik Mart..." onChange={(e)=>setSearch(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition" />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                    {filteredProducts.map(product => (
                                        <div key={product.id} className="product-card bg-white rounded-2xl border border-slate-100 overflow-hidden shadow-sm group">
                                            <div className="relative overflow-hidden h-56">
                                                <img src={product.image} className="w-full h-full object-cover group-hover:scale-110 transition duration-500" />
                                                <div className="absolute top-3 right-3 bg-white/90 px-2 py-1 rounded-lg text-xs font-bold flex items-center gap-1">
                                                    <i data-lucide="star" className="w-3 h-3 text-orange-500 fill-orange-500"></i> {product.rating}
                                                </div>
                                            </div>
                                            <div className="p-5">
                                                <p className="text-indigo-600 text-[10px] font-bold uppercase tracking-widest mb-1">{product.category}</p>
                                                <h3 className="font-bold text-lg mb-1">{product.name}</h3>
                                                <p className="text-slate-500 text-xs mb-4 line-clamp-2">{product.desc}</p>
                                                <div className="flex items-center justify-between">
                                                    <span className="text-2xl font-black">${product.price}</span>
                                                    <button onClick={() => addToCart(product)} className="bg-slate-900 text-white p-2 rounded-lg hover:bg-indigo-600 transition shadow-lg active:scale-90">
                                                        <i data-lucide="plus" className="w-5 h-5"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </main>
                        </>
                    )}

                    {view === 'checkout' && (
                        <div className="max-w-4xl mx-auto px-6 py-20">
                            <div className="grid md:grid-cols-2 gap-12">
                                <div>
                                    <h2 className="text-3xl font-extrabold mb-8">Secure Checkout</h2>
                                    <form onSubmit={handleCheckout} className="space-y-4">
                                        <input required className="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Full Name" />
                                        <input required type="email" className="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Email Address" />
                                        <div className="grid grid-cols-2 gap-4">
                                            <input required className="p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Expiry MM/YY" />
                                            <input required className="p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="CVV" />
                                        </div>
                                        <input required pattern="\d{16}" title="16 digits card number" className="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Card Number (16 digits)" />
                                        <button type="submit" className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition active:scale-95">Complete Payment</button>
                                    </form>
                                </div>
                                <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-xl h-fit">
                                    <h3 className="font-bold text-xl mb-6">Order Summary</h3>
                                    <div className="space-y-4 mb-6">
                                        {cart.map(item => (
                                            <div key={item.id} className="flex justify-between text-sm">
                                                <span>{item.name} <span className="text-slate-400">x{item.qty}</span></span>
                                                <span className="font-bold">${item.price * item.qty}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="border-t pt-4 flex justify-between items-center text-xl font-black">
                                        <span>Total</span>
                                        <span className="text-indigo-600">${cartTotal}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'success' && (
                        <div className="max-w-2xl mx-auto px-6 py-24 text-center">
                            <div className="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-8 shadow-inner">
                                <i data-lucide="check-circle-2" className="w-12 h-12"></i>
                            </div>
                            <h2 className="text-4xl font-black mb-4">Order Confirmed!</h2>
                            <p className="text-slate-500 mb-10 text-lg">Thank you for shopping at Karthik Mart. We've sent your receipt to your email.</p>
                            <div className="bg-white rounded-3xl p-8 border border-slate-100 shadow-lg text-left mb-10">
                                <h4 className="font-bold border-b pb-4 mb-4">Your Purchase History</h4>
                                <div className="space-y-4">
                                    {history.map(order => (
                                        <div key={order.id} className="flex justify-between items-center text-sm bg-slate-50 p-3 rounded-xl">
                                            <div>
                                                <p className="font-bold">{order.id}</p>
                                                <p className="text-slate-400 text-xs">{order.date} • {order.items} Items</p>
                                            </div>
                                            <span className="font-black text-indigo-600">${order.total}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <button onClick={()=>setView('shop')} className="bg-slate-900 text-white px-10 py-4 rounded-full font-bold hover:bg-indigo-600 transition shadow-xl">Back to Shopping</button>
                        </div>
                    )}

                    {/* Cart Drawer Overlay */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onClick={()=>setIsCartOpen(false)}></div>
                            <div className="absolute inset-y-0 right-0 max-w-full flex">
                                <div className="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                                    <div className="p-6 border-b flex justify-between items-center">
                                        <h2 className="text-2xl font-black">My Cart</h2>
                                        <button onClick={()=>setIsCartOpen(false)} className="p-2 hover:bg-slate-100 rounded-full transition"><i data-lucide="x"></i></button>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-6 space-y-6">
                                        {cart.length === 0 ? (
                                            <div className="text-center py-20">
                                                <i data-lucide="shopping-cart" className="w-16 h-16 text-slate-200 mx-auto mb-4"></i>
                                                <p className="text-slate-400 font-medium">Your cart is empty</p>
                                            </div>
                                        ) : (
                                            cart.map(item => (
                                                <div key={item.id} className="flex gap-4 items-center">
                                                    <img src={item.image} className="w-20 h-20 rounded-2xl object-cover border" />
                                                    <div className="flex-1">
                                                        <h4 className="font-bold text-slate-800">{item.name}</h4>
                                                        <p className="text-indigo-600 font-bold">${item.price}</p>
                                                    </div>
                                                    <div className="flex items-center gap-2 bg-slate-100 rounded-xl p-1">
                                                        <button onClick={()=>updateQty(item.id, -1)} className="w-8 h-8 flex items-center justify-center hover:bg-white rounded-lg transition">-</button>
                                                        <span className="w-4 text-center font-bold text-sm">{item.qty}</span>
                                                        <button onClick={()=>updateQty(item.id, 1)} className="w-8 h-8 flex items-center justify-center hover:bg-white rounded-lg transition">+</button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                    <div className="p-6 border-t bg-slate-50">
                                        <div className="flex justify-between items-center mb-6">
                                            <span className="text-slate-500 font-medium">Subtotal</span>
                                            <span className="text-2xl font-black">${cartTotal}</span>
                                        </div>
                                        <button 
                                            disabled={cart.length === 0}
                                            onClick={()=>{setIsCartOpen(false); setView('checkout');}}
                                            className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 disabled:bg-slate-300 disabled:shadow-none transition transform active:scale-95"
                                        >
                                            Checkout Now
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="bg-slate-900 text-white py-12 px-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                            <div>
                                <h3 className="text-2xl font-black mb-2 uppercase">Karthik<span className="text-indigo-400">Mart</span></h3>
                                <p className="text-slate-400 text-sm">Experience the future of digital commerce.</p>
                            </div>
                            <div className="flex gap-6">
                                <a href="#" className="hover:text-indigo-400 transition">Privacy</a>
                                <a href="#" className="hover:text-indigo-400 transition">Terms</a>
                                <a href="#" className="hover:text-indigo-400 transition">Contact</a>
                            </div>
                            <div className="text-slate-500 text-sm">© 2024 Karthik Mart. All rights reserved.</div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
